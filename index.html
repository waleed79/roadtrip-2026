<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>East Coast Road Trip</title>
<meta name="description" content="Eight days from Chicago through Vermont, Acadia, Boston, New York and DC, Nov 21–28 2026.">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='none' stroke='%2334c759' stroke-width='5'/></svg>">
<style>
:root{
  --bg:#f5f5f7;
  --cell:#ffffff;
  --label:#1d1d1f;
  --secondary:#6e6e73;
  --tertiary:#aeaeb2;
  --sep:#d2d2d7;
  --fill:#f0f0f2;
  --blue:#0071e3;
  --green:#34c759;
  --red:#ff3b30;
  --indigo:#5856d6;
  --ring-track:#e5e5ea;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --cell:#1c1c1e; --label:#f5f5f7; --secondary:#98989d; --tertiary:#636366;
    --sep:#38383a; --fill:#2c2c2e; --blue:#0a84ff; --green:#30d158; --red:#ff453a; --indigo:#5e5ce6;
    --ring-track:#2c2c2e;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,sans-serif;
  font-size:17px;line-height:1.35;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:2px;border-radius:10px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* ---------- Header ---------- */
header{padding:48px 0 28px;display:flex;align-items:center;gap:20px}
header .t{flex:1;min-width:0}
h1{margin:0;font-size:clamp(34px,8.5vw,48px);line-height:1.05;font-weight:700;letter-spacing:-.025em}
.sub{margin:8px 0 0;color:var(--secondary);font-size:17px}
.ring{flex:0 0 auto;width:84px;text-align:center}
.ring svg{display:block;width:84px;height:84px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .track{stroke:var(--ring-track)}
.ring .val{stroke:var(--green);transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring .n{display:block;font-size:13px;color:var(--secondary);margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Day list ---------- */
.list{display:flex;flex-direction:column;gap:12px}
.day{background:var(--cell);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px}
.cal{flex:0 0 auto;width:46px;height:50px;border-radius:11px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cal small{font-size:10px;font-weight:600;color:var(--red);letter-spacing:.02em}
.cal span{font-size:22px;font-weight:500;margin-top:3px;letter-spacing:-.02em}
.day.today .cal{background:var(--red)}
.day.today .cal small,.day.today .cal span{color:#fff}
.row .t{flex:1;min-width:0}
.row h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.row .meta{display:block;font-size:15px;color:var(--secondary);margin-top:2px}
.tally{flex:0 0 auto;font-size:15px;color:var(--secondary);font-variant-numeric:tabular-nums}
.day.complete .tally{color:var(--green);font-weight:600}
.chev{flex:0 0 auto;width:13px;height:13px;color:var(--tertiary);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.day.open .chev{transform:rotate(90deg)}

/* expand: animate height via grid rows */
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.2,.8,.2,1)}
.day.open .panel{grid-template-rows:1fr}
.panel > div{overflow:hidden;min-height:0}
.inner{padding:0 16px 8px}
.day:not(.open) .inner{visibility:hidden}

/* settings-style rows */
.cells{border-top:.5px solid var(--sep)}
.cell{display:flex;align-items:center;gap:12px;padding:11px 0;min-height:52px;border-bottom:.5px solid var(--sep);color:var(--label)}
.cell .ico{flex:0 0 auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff}
.cell .ico svg{width:17px;height:17px}
.cell .ico.bed{background:var(--indigo)}
.cell .ico.car{background:var(--blue)}
.cell .ico.web{background:#ff5a5f}
.cell .tx{flex:1;min-width:0}
.cell .tx b{display:block;font-weight:400}
.cell .tx span{display:block;font-size:15px;color:var(--secondary)}
.cell .go{flex:0 0 auto;width:8px;height:13px;color:var(--tertiary)}
.note{font-size:13px;line-height:1.4;color:var(--secondary);padding:10px 0 0;margin:0}

.group{margin-top:22px}
.group h3{margin:0 0 4px;font-size:15px;font-weight:600;color:var(--label);letter-spacing:-.01em}
ul.places{list-style:none;margin:0;padding:0}
.place{display:flex;align-items:center;gap:12px;min-height:50px;border-bottom:.5px solid var(--sep)}
.place:last-child{border-bottom:0}
.place label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:11px 0;cursor:pointer}
.check{flex:0 0 auto;appearance:none;-webkit-appearance:none;margin:0;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--tertiary);display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s}
.check:checked{background:var(--green);border-color:var(--green)}
.check:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:translateY(-1px) rotate(45deg)}
.pn{display:block}
.pnote{display:block;font-size:13px;color:var(--secondary);margin-top:1px}
.place.done .pn{color:var(--secondary)}
.map{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--blue)}
.map svg{width:16px;height:16px}
.empty{font-size:15px;color:var(--secondary);margin:18px 0 6px}

footer{padding:32px 16px 56px;font-size:13px;color:var(--secondary);text-align:center}
footer button{color:var(--blue);font-size:13px;margin-top:10px}

@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="t">
      <h1>East Coast Road Trip</h1>
      <p class="sub">November 21–28. Eight days, about 3,200 miles.</p>
    </div>
    <div class="ring" aria-live="polite">
      <svg viewBox="0 0 84 84" aria-hidden="true">
        <circle class="track" cx="42" cy="42" r="35"/>
        <circle class="val" id="ringVal" cx="42" cy="42" r="35"/>
      </svg>
      <span class="n" id="ringText">0 of 0 seen</span>
    </div>
  </header>

  <div class="list" id="list"></div>
</main>

<footer>
  Checkmarks are saved on this device.<br>
  Drive times are estimates without stops.<br>
  <button type="button" id="reset">Clear checkmarks</button>
</footer>

<script>
const MAP = q => "https://maps.google.com/?q=" + encodeURIComponent(q);
const DIR = s => "https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=" + encodeURIComponent(s[0]) +
  "&destination=" + encodeURIComponent(s[s.length-1]) +
  (s.length > 2 ? "&waypoints=" + encodeURIComponent(s.slice(1,-1).join("|")) : "");

/* Top sights only: in the town we're in, or right on the road. No food stops. */
const DAYS = [
{ id:"d1", date:"2026-11-21", title:"Chicago to Syracuse", meta:"700 mi, about 11 hours",
  route:["Chicago, IL","Ann Arbor, MI","Erie, PA","6609 Thompson Road, East Syracuse, NY 13206"],
  stay:{name:"Days Inn by Wyndham Syracuse", addr:"6609 Thompson Road, East Syracuse, NY 13206"},
  note:"Longest driving day. Leave early and swap drivers every couple of hours.",
  groups:[
    {place:"Ann Arbor", items:[
      {id:"aa-bighouse", name:"Michigan Stadium", note:"The Big House", q:"Michigan Stadium, Ann Arbor"},
      {id:"aa-lawquad", name:"Law Quadrangle", q:"University of Michigan Law Quadrangle"},
      {id:"aa-diag", name:"The Diag", q:"The Diag, University of Michigan"},
      {id:"aa-arb", name:"Nichols Arboretum", q:"Nichols Arboretum, Ann Arbor"}
    ]},
    {place:"Syracuse", items:[
      {id:"syr-armory", name:"Armory Square", q:"Armory Square, Syracuse"},
      {id:"syr-clinton", name:"Clinton Square", q:"Clinton Square, Syracuse"},
      {id:"syr-su", name:"Syracuse University", note:"Crouse College and the Quad", q:"Crouse College, Syracuse University"},
      {id:"syr-lake", name:"Onondaga Lake Park", q:"Onondaga Lake Park"}
    ]}
  ]},
{ id:"d2", date:"2026-11-22", title:"Green Mountains to Woodstock", meta:"330 mi, about 6 hours",
  route:["East Syracuse, NY","Robert Frost Interpretive Trail, Ripton, VT","Texas Falls Recreation Area, Hancock, VT","Woodstock, VT","2617 Killington Road, Killington, VT 05751"],
  stay:{name:"Killington Mountain Lodge", addr:"2617 Killington Road, Killington, VT 05751"},
  note:"Cross the forest on VT-125, then take VT-100 and US-4 to Woodstock. Sunset is around 4:15 pm.",
  groups:[
    {place:"Green Mountain National Forest", items:[
      {id:"gm-gap", name:"Middlebury Gap", note:"The pass on VT-125", q:"Middlebury Gap, Vermont"},
      {id:"gm-breadloaf", name:"Bread Loaf Campus", note:"Yellow farmhouses on VT-125", q:"Bread Loaf Campus, Ripton VT"},
      {id:"gm-frost", name:"Robert Frost Trail", note:"Easy 1-mile loop", q:"Robert Frost Interpretive Trail, Ripton VT"},
      {id:"gm-texas", name:"Texas Falls", q:"Texas Falls Recreation Area, Hancock VT"}
    ]},
    {place:"Woodstock", items:[
      {id:"wd-green", name:"Village Green", q:"Woodstock Village Green, Vermont"},
      {id:"wd-bridge", name:"Middle Covered Bridge", q:"Middle Covered Bridge, Woodstock VT"},
      {id:"wd-mbr", name:"Marsh-Billings-Rockefeller Park", q:"Marsh-Billings-Rockefeller National Historical Park"},
      {id:"wd-tom", name:"Mount Tom", note:"Short climb for the view over town", q:"Faulkner Trail, Mount Tom, Woodstock VT"}
    ]}
  ]},
{ id:"d3", date:"2026-11-23", title:"Acadia National Park", meta:"300 mi, about 6 hours",
  route:["Killington, VT","Bass Harbor Head Light Station, ME","119 Eden Street, Bar Harbor, ME 04609"],
  stay:{name:"Atlantic Oceanside Hotel", addr:"119 Eden Street, Bar Harbor, ME 04609"},
  note:"Sunset is about 4:00 pm, so leave early. Cadillac Mountain also works at sunrise tomorrow. You need a park pass.",
  groups:[
    {place:"Acadia", items:[
      {id:"ac-cadillac", name:"Cadillac Mountain", q:"Cadillac Mountain Summit"},
      {id:"ac-jordan", name:"Jordan Pond", q:"Jordan Pond, Acadia National Park"},
      {id:"ac-sand", name:"Sand Beach", q:"Sand Beach, Acadia National Park"},
      {id:"ac-thunder", name:"Thunder Hole", q:"Thunder Hole, Acadia"},
      {id:"ac-bass", name:"Bass Harbor Head Light", q:"Bass Harbor Head Light Station"}
    ]}
  ]},
{ id:"d4", date:"2026-11-24", title:"Acadia to Boston", meta:"280 mi, about 5 hours",
  route:["Bar Harbor, ME","250 Monsignor O'Brien Highway, Cambridge, MA 02141"],
  stay:{name:"Airbnb, Cambridge", addr:"250 Monsignor O'Brien Highway, Cambridge, MA 02141", link:"https://www.airbnb.com/l/Sw1Korlt"},
  note:"Until early March, Cadillac Mountain gets the first sunrise in the US, around 6:50 am.",
  groups:[]},
{ id:"d5", date:"2026-11-25", title:"Boston and Providence to New York", meta:"220 mi, about 4.5 hours",
  route:["Cambridge, MA","Providence, RI","New York, NY"],
  stay:{name:"Airbnb, New York", addr:"", link:"https://www.airbnb.com/l/S04Uihm8"},
  note:"Heavy traffic the day before Thanksgiving. Macy's parade balloons are inflated tonight near the Natural History Museum.",
  groups:[
    {place:"Boston", items:[
      {id:"bos-freedom", name:"Freedom Trail", note:"Boston Common to Faneuil Hall", q:"Freedom Trail, Boston"},
      {id:"bos-acorn", name:"Beacon Hill and Acorn Street", q:"Acorn Street, Boston"},
      {id:"bos-harvard", name:"Harvard Yard", q:"Harvard Yard, Cambridge"},
      {id:"bos-mit", name:"MIT Great Dome", q:"Killian Court, MIT"}
    ]},
    {place:"Providence", items:[
      {id:"pvd-statehouse", name:"Rhode Island State House", q:"Rhode Island State House"},
      {id:"pvd-benefit", name:"Benefit Street", note:"Historic houses on College Hill", q:"Benefit Street, Providence"},
      {id:"pvd-waterplace", name:"WaterPlace Park and Riverwalk", q:"WaterPlace Park, Providence"},
      {id:"pvd-prospect", name:"Prospect Terrace Park", note:"View over the city", q:"Prospect Terrace Park, Providence"}
    ]}
  ]},
{ id:"d6", date:"2026-11-26", title:"Thanksgiving in New York", meta:"Then 230 mi to DC, about 4.5 hours",
  route:["New York, NY","4400 Connecticut Avenue NW, Washington, DC 20008"],
  stay:{name:"Days Inn, Connecticut Avenue", addr:"4400 Connecticut Avenue NW, Washington, DC 20008"},
  note:"Parade runs about 8:30 am to noon. Be on Central Park West by 7. Use the subway.",
  groups:[
    {place:"New York", items:[
      {id:"ny-parade", name:"Macy's Thanksgiving Day Parade", q:"Central Park West & W 72nd St, New York"},
      {id:"ny-central", name:"Central Park", q:"Bethesda Terrace, Central Park"},
      {id:"ny-times", name:"Times Square", q:"Times Square, New York"},
      {id:"ny-bridge", name:"Brooklyn Bridge", q:"Brooklyn Bridge"}
    ]}
  ]},
{ id:"d7", date:"2026-11-27", title:"Washington, DC", meta:"Then 300 mi to Parkersburg, about 5.5 hours",
  route:["Washington, DC","97 Emerson Commons Blvd, Parkersburg, WV 26104"],
  stay:{name:"Sleep Inn & Suites Parkersburg", addr:"97 Emerson Commons Blvd, Parkersburg, WV 26104"},
  note:"Smithsonian museums are free. Air and Space needs a free timed pass booked online.",
  groups:[
    {place:"Washington", items:[
      {id:"dc-lincoln", name:"Lincoln Memorial", q:"Lincoln Memorial"},
      {id:"dc-wamo", name:"Washington Monument", q:"Washington Monument"},
      {id:"dc-capitol", name:"US Capitol", q:"United States Capitol"},
      {id:"dc-air", name:"Air and Space Museum", q:"National Air and Space Museum"}
    ]}
  ]},
{ id:"d8", date:"2026-11-28", title:"Home through Columbus", meta:"520 mi, about 8 hours",
  route:["Parkersburg, WV","Columbus, OH","Chicago, IL"],
  stay:null, note:"",
  groups:[
    {place:"Columbus", items:[
      {id:"cbus-statehouse", name:"Ohio Statehouse", q:"Ohio Statehouse"},
      {id:"cbus-german", name:"German Village", note:"Brick streets, just off I-70", q:"German Village, Columbus"},
      {id:"cbus-scioto", name:"Scioto Mile", note:"Riverfront park downtown", q:"Scioto Mile, Columbus"},
      {id:"cbus-short", name:"Short North Arts District", q:"Short North Arts District"}
    ]}
  ]}
];

/* ---------- State: checkmarks persist on this device; days always start closed ---------- */
const KEY = "roadtrip2026:v1";
let checked = {};
try { checked = (JSON.parse(localStorage.getItem(KEY)) || {}).checked || {}; } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({checked})); } catch(e){} };

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const d0 = new Date(), TODAY = d0.getFullYear()+"-"+pad(d0.getMonth()+1)+"-"+pad(d0.getDate());
const allItems = d => d.groups.flatMap(g => g.items);

const I = {
  chev:'<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l5 5-5 5"/></svg>',
  go:'<svg class="go" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l5 5-5 5"/></svg>',
  bed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19V6M3 14h18v5M21 14a3 3 0 0 0-3-3h-7v3"/><circle cx="7" cy="11" r="1.6" fill="currentColor"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4 21l8-4 8 4z"/></svg>',
  web:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>'
};

function dayHTML(d){
  const dt = new Date(d.date+"T12:00:00");
  const wd = dt.toLocaleDateString("en-US",{weekday:"short"}).toUpperCase();
  const s = d.stay;
  const cells = [
    s ? `<a class="cell" href="${s.addr?MAP(s.addr):s.link}" target="_blank" rel="noopener">
          <span class="ico bed">${I.bed}</span>
          <span class="tx"><b>${esc(s.name)}</b>${s.addr?`<span>${esc(s.addr)}</span>`:""}</span>${I.go}</a>` : "",
    s && s.link ? `<a class="cell" href="${esc(s.link)}" target="_blank" rel="noopener">
          <span class="ico web">${I.web}</span><span class="tx"><b>Airbnb listing</b></span>${I.go}</a>` : "",
    `<a class="cell" href="${DIR(d.route)}" target="_blank" rel="noopener">
          <span class="ico car">${I.car}</span><span class="tx"><b>Directions</b><span>${esc(d.from)} to ${esc(d.to)}</span></span>${I.go}</a>`
  ].join("");
  const groups = d.groups.length ? d.groups.map(g => `
      <div class="group"><h3>${esc(g.place)}</h3><ul class="places">${g.items.map(it => `
        <li class="place${checked[it.id]?" done":""}">
          <label><input class="check" type="checkbox" data-id="${esc(it.id)}"${checked[it.id]?" checked":""}>
            <span><span class="pn">${esc(it.name)}</span>${it.note?`<span class="pnote">${esc(it.note)}</span>`:""}</span></label>
          <a class="map" href="${MAP(it.q)}" target="_blank" rel="noopener" aria-label="${esc(it.name)} in Maps">${I.pin}</a>
        </li>`).join("")}</ul></div>`).join("")
    : `<p class="empty">Mostly a driving day.</p>`;
  return `<section class="day${d.date===TODAY?" today":""}" id="${d.id}">
    <button class="row" type="button" aria-expanded="false" aria-controls="${d.id}-p">
      <span class="cal" aria-hidden="true"><small>${wd}</small><span>${dt.getDate()}</span></span>
      <span class="t"><h2>${esc(d.title)}</h2><span class="meta">${esc(d.meta)}</span></span>
      <span class="tally"></span>${I.chev}
    </button>
    <div class="panel" id="${d.id}-p"><div><div class="inner">
      <div class="cells">${cells}</div>
      ${d.note?`<p class="note">${esc(d.note)}</p>`:""}
      ${groups}
    </div></div></div>
  </section>`;
}

// Plain-language start and end of each day's drive, for the Directions row
const LEGS = {d1:["Chicago","Syracuse"], d2:["Syracuse","Killington"], d3:["Killington","Bar Harbor"], d4:["Bar Harbor","Cambridge"],
  d5:["Cambridge","New York"], d6:["New York","Washington"], d7:["Washington","Parkersburg"], d8:["Parkersburg","Chicago"]};
DAYS.forEach(d => { [d.from, d.to] = LEGS[d.id]; });

const list = document.getElementById("list");
list.innerHTML = DAYS.map(dayHTML).join("");

const C = 2 * Math.PI * 35;
const ringVal = document.getElementById("ringVal");
ringVal.style.strokeDasharray = C;

function refresh(){
  let total = 0, seen = 0;
  DAYS.forEach(d => {
    const items = allItems(d), done = items.filter(x => checked[x.id]).length;
    total += items.length; seen += done;
    const el = document.getElementById(d.id);
    el.querySelector(".tally").textContent = items.length ? `${done}/${items.length}` : "";
    el.classList.toggle("complete", items.length > 0 && done === items.length);
  });
  ringVal.style.strokeDashoffset = total ? C * (1 - seen/total) : C;
  document.getElementById("ringText").textContent = `${seen} of ${total} seen`;
}

list.addEventListener("click", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const day = row.parentElement, open = !day.classList.contains("open");
  day.classList.toggle("open", open);
  row.setAttribute("aria-expanded", open);
});
list.addEventListener("change", e => {
  const id = e.target.dataset.id; if (!id) return;
  if (e.target.checked) checked[id] = 1; else delete checked[id];
  e.target.closest(".place").classList.toggle("done", e.target.checked);
  save(); refresh();
});
document.getElementById("reset").onclick = () => {
  if (!confirm("Clear all checkmarks on this device?")) return;
  checked = {}; save();
  document.querySelectorAll(".check").forEach(c => { c.checked = false; c.closest(".place").classList.remove("done"); });
  refresh();
};
refresh();
</script>
</body>
</html>
